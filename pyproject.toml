[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odl-layout"
version = "0.1.0"
description = "Layout compiler for the OpenDisplay Language: containers in, positioned ODL elements out"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "g4bri3lDev", email = "admin@g4bri3l.de"}
]

keywords = ["e-paper", "eink", "layout", "odl", "opendisplay", "open-display-language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "odl-renderer>=0.6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "hypothesis>=6.151.12",
]
dev = [
    "mypy>=1.19.1",
    "prek>=0.3.4",
    "ruff>=0.14.10",
]

[project.urls]
Homepage = "https://opendisplay.org"
Repository = "https://github.com/OpenDisplay/odl-layout"
Documentation = "https://github.com/OpenDisplay/odl-layout#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/odl_layout"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Neither package ships a py.typed marker
module = ["odl_renderer", "odl_renderer.*", "qrcode"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
# Local development against a sibling odl-renderer checkout (measure_text is unreleased)
odl-renderer = { path = "../odl-renderer", editable = true }
